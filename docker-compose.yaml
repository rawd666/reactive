services:
  reactive:
    build:
      context: .
      args:
        VITE_PAYPAL_PLAN_LAUNCH: ${VITE_PAYPAL_PLAN_LAUNCH}
        VITE_PAYPAL_PLAN_GROW: ${VITE_PAYPAL_PLAN_GROW}
        VITE_PAYPAL_PLAN_SCALE: ${VITE_PAYPAL_PLAN_SCALE}
        VITE_PAYPAL_CLIENT_ID: ${VITE_PAYPAL_CLIENT_ID}
    image: reactive:prod
    container_name: reactive
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      NODE_ENV: production
    volumes:
      # Client records. Without this the database is lost on every rebuild.
      - reactive-data:/app/data
    networks:
      - edge-traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge-traefik"
      - "traefik.http.middlewares.reactive-compress.compress=true"
      - "traefik.http.middlewares.reactive-compress.compress.encodings=br,zstd,gzip"
      - "traefik.http.middlewares.reactive-secheaders.headers.customResponseHeaders.Server="
      # HTTPS only for a year. No includeSubdomains/preload: other subdomains may not have TLS.
      - "traefik.http.middlewares.reactive-secheaders.headers.stsSeconds=31536000"
      # Nobody may frame the site, so /admin can't be clickjacked.
      - "traefik.http.middlewares.reactive-secheaders.headers.frameDeny=true"
      - "traefik.http.middlewares.reactive-secheaders.headers.contentSecurityPolicy=frame-ancestors 'none'"
      - "traefik.http.middlewares.reactive-secheaders.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.reactive-secheaders.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.routers.reactive-web.rule=Host(`reactiveweb.dev`)"
      - "traefik.http.routers.reactive-web.entrypoints=websecure"
      - "traefik.http.routers.reactive-web.tls.certresolver=le"
      - "traefik.http.routers.reactive-web.middlewares=reactive-compress@docker,reactive-secheaders@docker"
      - "traefik.http.services.reactive-web.loadbalancer.server.port=5173"
      - "traefik.http.middlewares.reactive-www-redirect.redirectregex.regex=^https://www\\.reactiveweb\\.dev/(.*)"
      - "traefik.http.middlewares.reactive-www-redirect.redirectregex.replacement=https://reactiveweb.dev/$${1}"
      - "traefik.http.middlewares.reactive-www-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.reactive-web-www.rule=Host(`www.reactiveweb.dev`)"
      - "traefik.http.routers.reactive-web-www.entrypoints=websecure"
      - "traefik.http.routers.reactive-web-www.tls.certresolver=le"
      - "traefik.http.routers.reactive-web-www.middlewares=reactive-www-redirect@docker"
      - "traefik.http.routers.reactive-web-www.service=reactive-web"

volumes:
  reactive-data:

networks:
  edge-traefik:
    external: true