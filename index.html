<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta (per-page values are set at runtime by <Seo>; these are the fallbacks) -->
    <title>Reactive</title>
    <meta
      name="description"
      content="Reactive builds fast, custom React websites for small and new businesses across the US. No templates — booking systems, e-commerce, and animations built around your business. See packages and pricing."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Reactive" />
    <link rel="canonical" href="https://reactiveweb.dev/" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reactive" />
    <meta property="og:title" content="Reactive — Custom React Websites for Small Businesses" />
    <meta
      property="og:description"
      content="Fast, custom React websites for small and new businesses across the US. No templates. See packages and pricing."
    />
    <meta property="og:url" content="https://reactiveweb.dev/" />
    <meta property="og:image" content="https://reactiveweb.dev/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Reactive — Custom React Websites for Small Businesses" />
    <meta
      name="twitter:description"
      content="Fast, custom React websites for small and new businesses across the US. No templates. See packages and pricing."
    />
    <meta name="twitter:image" content="https://reactiveweb.dev/og-image.png" />

    <!-- Structured data: helps Google understand the business + US-wide service area -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "ProfessionalService",
            "@id": "https://reactiveweb.dev/#business",
            "name": "Reactive",
            "description": "Custom React website design and development for small and new businesses across the United States.",
            "url": "https://reactiveweb.dev/",
            "image": "https://reactiveweb.dev/og-image.png",
            "logo": "https://reactiveweb.dev/favicon.svg",
            "email": "rawd@reactiveweb.dev",
            "priceRange": "$$",
            "areaServed": {
              "@type": "Country",
              "name": "United States"
            },
            "serviceType": [
              "Custom website design",
              "React web development",
              "Small business websites",
              "E-commerce websites",
              "Booking system development"
            ],
            "knowsLanguage": "en-US",
            "sameAs": []
          },
          {
            "@type": "WebSite",
            "@id": "https://reactiveweb.dev/#website",
            "url": "https://reactiveweb.dev/",
            "name": "Reactive",
            "publisher": { "@id": "https://reactiveweb.dev/#business" },
            "inLanguage": "en-US"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
